<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Kejun Liu 的个人主页和一个可以随手玩的贪吃蛇游戏。">
    <title>Kejun Liu</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #171717;
        background: #faf9f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 0;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: clamp(1.5rem, 6vw, 5rem);
      }

      main {
        width: 100%;
        max-width: 58rem;
        margin: 0 auto;
      }

      .intro {
        min-height: calc(100svh - clamp(3rem, 12vw, 10rem));
        display: grid;
        align-content: center;
        max-width: 44rem;
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: #737373;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 11vw, 7.5rem);
        font-weight: 650;
        letter-spacing: -0.055em;
        line-height: 0.92;
      }

      .name {
        display: block;
        margin-top: 0.12em;
      }

      .message {
        max-width: 32rem;
        margin: clamp(2rem, 5vw, 3.5rem) 0 0;
        color: #525252;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.8;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        margin: clamp(2.5rem, 7vw, 5rem) 0 0;
        color: #737373;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
      }

      .status::before {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 50%;
        background: #a3a3a3;
        content: "";
      }

      .game {
        padding: clamp(4rem, 10vw, 8rem) 0 2rem;
        border-top: 1px solid #deddd9;
      }

      .game-header {
        max-width: 34rem;
        margin-bottom: clamp(2rem, 5vw, 3.5rem);
      }

      .game-header h2 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4.5rem);
        font-weight: 650;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .game-description,
      .controls {
        color: #626262;
        line-height: 1.7;
      }

      .game-description {
        margin: 1.25rem 0 0;
      }

      .game-layout {
        display: grid;
        grid-template-columns: minmax(0, 25rem) minmax(12rem, 1fr);
        gap: clamp(1.5rem, 5vw, 4rem);
        align-items: start;
      }

      canvas {
        display: block;
        width: 100%;
        max-width: 25rem;
        aspect-ratio: 1;
        border: 1px solid #d4d3cf;
        border-radius: 0.4rem;
        background: #f2f1ee;
      }

      canvas:focus-visible {
        outline: 3px solid #171717;
        outline-offset: 4px;
      }

      .game-panel {
        display: grid;
        gap: 2rem;
      }

      .scoreboard {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
        margin: 0;
      }

      .scoreboard div {
        padding: 1rem;
        border: 1px solid #deddd9;
        border-radius: 0.4rem;
      }

      .scoreboard dt {
        color: #737373;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .scoreboard dd {
        margin: 0.3rem 0 0;
        font-size: 1.8rem;
        font-variant-numeric: tabular-nums;
      }

      .game-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      button {
        min-height: 2.75rem;
        padding: 0.65rem 1rem;
        border: 1px solid #171717;
        border-radius: 999px;
        font: inherit;
        font-weight: 600;
        color: #faf9f7;
        background: #171717;
        cursor: pointer;
      }

      button + button {
        color: #171717;
        background: transparent;
      }

      button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      button:focus-visible {
        outline: 3px solid #171717;
        outline-offset: 3px;
      }

      .game-state {
        margin: 0;
        font-weight: 600;
      }

      .controls {
        margin: -1rem 0 0;
        font-size: 0.88rem;
      }

      kbd {
        padding: 0.12rem 0.35rem;
        border: 1px solid #c7c6c2;
        border-bottom-width: 2px;
        border-radius: 0.25rem;
        font-family: inherit;
        font-size: 0.78rem;
        background: #fff;
      }

      @media (max-width: 44rem) {
        .game-layout {
          grid-template-columns: 1fr;
        }

        .game-panel {
          max-width: 25rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="intro-title">
        <div>
          <p class="eyebrow">Personal homepage</p>
          <h1 id="intro-title">Hello.<span class="name">I’m Kejun Liu.</span></h1>
          <p class="message">个人主页正在建设中，欢迎以后再来看看。</p>
          <p class="status">Coming soon</p>
        </div>
      </section>

      <section class="game" aria-labelledby="game-title">
        <header class="game-header">
          <p class="eyebrow">Take a short break</p>
          <h2 id="game-title">来玩一局贪吃蛇。</h2>
          <p class="game-description">吃掉方块，别撞到墙，也别撞到自己。</p>
        </header>

        <div class="game-layout">
          <canvas
            id="snake-board"
            width="400"
            height="400"
            tabindex="0"
            aria-label="贪吃蛇游戏区域"
            aria-describedby="game-status controls-instructions"
          ></canvas>

          <div class="game-panel">
            <dl class="scoreboard">
              <div>
                <dt>Score</dt>
                <dd id="score" aria-live="polite" aria-atomic="true">0</dd>
              </div>
              <div>
                <dt>Best</dt>
                <dd id="best-score">0</dd>
              </div>
            </dl>

            <div class="game-actions">
              <button id="start-game" type="button">开始游戏</button>
              <button id="pause-game" type="button" disabled>暂停</button>
            </div>

            <p id="game-status" class="game-state" aria-live="polite">准备开始</p>
            <p id="controls-instructions" class="controls">
              使用方向键或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动，
              <kbd>Space</kbd> 暂停。
            </p>
          </div>
        </div>
      </section>
    </main>

    <script>
      (() => {
        const board = document.querySelector("#snake-board");
        const context = board.getContext("2d");
        const scoreElement = document.querySelector("#score");
        const bestScoreElement = document.querySelector("#best-score");
        const statusElement = document.querySelector("#game-status");
        const startButton = document.querySelector("#start-game");
        const pauseButton = document.querySelector("#pause-game");

        const gridSize = 20;
        const cellSize = board.width / gridSize;
        const tickDuration = 140;
        const directions = {
          ArrowUp: { x: 0, y: -1 },
          KeyW: { x: 0, y: -1 },
          ArrowDown: { x: 0, y: 1 },
          KeyS: { x: 0, y: 1 },
          ArrowLeft: { x: -1, y: 0 },
          KeyA: { x: -1, y: 0 },
          ArrowRight: { x: 1, y: 0 },
          KeyD: { x: 1, y: 0 },
        };

        let snake;
        let food;
        let direction;
        let nextDirection;
        let score;
        let bestScore = readBestScore();
        let timer = null;
        let isPlaying = false;
        let isPaused = false;

        function readBestScore() {
          try {
            return Number.parseInt(localStorage.getItem("kejun-snake-best"), 10) || 0;
          } catch {
            return 0;
          }
        }

        function saveBestScore() {
          try {
            localStorage.setItem("kejun-snake-best", String(bestScore));
          } catch {
            // The game remains playable when storage is unavailable.
          }
        }

        function isOnSnake(position) {
          return snake.some((segment) => segment.x === position.x && segment.y === position.y);
        }

        function placeFood() {
          const openCells = [];
          for (let y = 0; y < gridSize; y += 1) {
            for (let x = 0; x < gridSize; x += 1) {
              const position = { x, y };
              if (!isOnSnake(position)) openCells.push(position);
            }
          }
          food = openCells[Math.floor(Math.random() * openCells.length)];
        }

        function drawCell(position, color, inset = 1) {
          context.fillStyle = color;
          context.fillRect(
            position.x * cellSize + inset,
            position.y * cellSize + inset,
            cellSize - inset * 2,
            cellSize - inset * 2,
          );
        }

        function draw() {
          context.fillStyle = "#f2f1ee";
          context.fillRect(0, 0, board.width, board.height);

          if (food) drawCell(food, "#9a3f32", 3);
          snake.forEach((segment, index) => {
            drawCell(segment, index === 0 ? "#171717" : "#4a4a48");
          });
        }

        function updateScore() {
          scoreElement.textContent = String(score);
          bestScoreElement.textContent = String(bestScore);
        }

        function resetGame() {
          snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 },
          ];
          direction = { x: 1, y: 0 };
          nextDirection = direction;
          score = 0;
          placeFood();
          updateScore();
          draw();
        }

        function finishGame(message) {
          window.clearInterval(timer);
          timer = null;
          isPlaying = false;
          isPaused = false;
          statusElement.textContent = message;
          startButton.textContent = "重新开始";
          pauseButton.textContent = "暂停";
          pauseButton.disabled = true;
        }

        function tick() {
          direction = nextDirection;
          const head = {
            x: snake[0].x + direction.x,
            y: snake[0].y + direction.y,
          };
          const hitWall =
            head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize;
          const willEat = head.x === food.x && head.y === food.y;
          const collisionBody = willEat ? snake : snake.slice(0, -1);
          const hitSelf = collisionBody.some(
            (segment) => segment.x === head.x && segment.y === head.y,
          );

          if (hitWall || hitSelf) {
            finishGame(`游戏结束 · ${score} 分`);
            return;
          }

          snake.unshift(head);
          if (willEat) {
            score += 1;
            if (score > bestScore) {
              bestScore = score;
              saveBestScore();
            }
            placeFood();
            updateScore();
          } else {
            snake.pop();
          }
          draw();
        }

        function startGame() {
          window.clearInterval(timer);
          resetGame();
          isPlaying = true;
          isPaused = false;
          statusElement.textContent = "游戏进行中";
          startButton.textContent = "重新开始";
          pauseButton.textContent = "暂停";
          pauseButton.disabled = false;
          timer = window.setInterval(tick, tickDuration);
          board.focus();
        }

        function togglePause() {
          if (!isPlaying) return;
          isPaused = !isPaused;
          if (isPaused) {
            window.clearInterval(timer);
            timer = null;
            statusElement.textContent = "已暂停";
            pauseButton.textContent = "继续";
          } else {
            timer = window.setInterval(tick, tickDuration);
            statusElement.textContent = "游戏进行中";
            pauseButton.textContent = "暂停";
            board.focus();
          }
        }

        function handleKeydown(event) {
          if (event.code === "Space" && isPlaying) {
            event.preventDefault();
            togglePause();
            return;
          }

          const requestedDirection = directions[event.code];
          if (!requestedDirection || !isPlaying || isPaused) return;

          event.preventDefault();
          const isReverse =
            requestedDirection.x === -direction.x && requestedDirection.y === -direction.y;
          if (!isReverse) nextDirection = requestedDirection;
        }

        startButton.addEventListener("click", startGame);
        pauseButton.addEventListener("click", togglePause);
        window.addEventListener("keydown", handleKeydown);

        bestScoreElement.textContent = String(bestScore);
        resetGame();
      })();
    </script>
  </body>
</html>
